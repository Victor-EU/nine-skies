name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Runs the schema checks and flies every authored route over real
      # ground (D17, D19). CI has no world and needs none: the ground under
      # each route is committed as a section beside it (D21), cut from the
      # built corridor and checked against the route it was cut from, so this
      # prints the same metres the author's machine printed. An expedition
      # with no section fails here rather than printing NOT CHECKED.
      #
      # It also checks the section's signature (D23). CI cannot re-derive one
      # elevation of it -- that needs 14 GB of rasters -- so what it can check
      # is that the file came out of a cut rather than out of an editor. A
      # section that does not verify is refused, never flown.
      - name: Content validation
        run: npm run content:validate
      - name: Build
        run: npm run build

  # Frame rate is deliberately not measured here: headless software
  # rasterisation produces a number that is precise and meaningless. CI guards
  # the things that cause frame rate to regress; real timings are captured on
  # the named floor device at each milestone.
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Draw call and triangle budget
        run: npm run test -- test/budget

  # The pipeline suite runs without GDAL or any elevation data -- it tests grid
  # arithmetic, tile orientation, seams and probe logic against synthetic
  # arrays, plus the committed artefacts it can reach with neither: the
  # projection table against PROJ (D22), a golden probe against a route
  # section (D23), and the source raster digests against the set each section
  # says it was cut from (D24). What it cannot do is compare a digest to the
  # mirror -- that happens where the 13.9 GB is, at `make sources` and again
  # at every build. But most of it is guarded by `skipUnless(HAVE_NUMPY)`, so on a bare
  # interpreter it would pass while asserting almost nothing. The preflight step
  # exists to make that failure loud rather than green.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Preflight — the optional deps must actually be here
        run: |
          python -c "import numpy, rasterio, affine, certifi; \
            print('numpy', numpy.__version__, '· rasterio', rasterio.__version__)"
      - name: Pipeline tests
        run: python -m unittest discover -s pipeline/tests -v
