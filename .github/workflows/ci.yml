name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Content validation
        run: npm run content:validate
      - name: Build
        run: npm run build

  # Frame rate is deliberately not measured here: headless software
  # rasterisation produces a number that is precise and meaningless. CI guards
  # the things that cause frame rate to regress; real timings are captured on
  # the named floor device at each milestone.
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Draw call and triangle budget
        run: npm run test -- test/budget
