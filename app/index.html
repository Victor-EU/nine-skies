<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nine Skies</title>
    <meta name="description" content="Eighteen minutes over real ground: nine scenes of China, two minutes each, flown over open elevation data." />
    <!-- The cover: the nine scenes as nine cards, drawn by `npm run cover`.
         A relative image is enough for the site itself; a scraper wants it
         absolute, which needs the published URL. -->
    <meta property="og:title" content="Nine Skies" />
    <meta property="og:description" content="Eighteen minutes over real ground: nine scenes of China, two minutes each, flown over open elevation data." />
    <meta property="og:image" content="./cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./src/film.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="film">
      <!-- The lead-in: the map with the jump to this scene, and the title card.
           Characters, pinyin, English, one line. -->
      <div id="title" class="title" hidden>
        <canvas id="leadMap" class="leadMap" width="800" height="560"></canvas>
        <div class="zh" id="titleZh"></div>
        <div class="pinyin" id="titlePinyin"></div>
        <div class="en" id="titleEn"></div>
        <div class="line" id="titleLine"></div>
      </div>
      <!-- Up to three captions a scene, twelve words or fewer, six seconds each. -->
      <div id="caption" class="caption"></div>
      <!-- Lit while the rail is flying. Tapping it resumes auto. -->
      <button id="auto" class="auto" type="button">AUTO</button>
      <!-- Something the film has to say about itself: no world, no film. -->
      <div id="notice" class="notice" hidden></div>
      <!-- After the last scene: the whole route, and the credits. -->
      <div id="end" class="end" hidden>
        <canvas id="endMap" class="leadMap" width="800" height="560"></canvas>
        <div class="en">Nine Skies</div>
        <div class="line">Eighteen minutes over real ground.</div>
        <button id="again" type="button">Watch again</button>
        <a class="creditsLink" href="./credits.html">Credits, sources and the question this asks</a>
      </div>
      <!-- The player bar: play and pause, the chapters, the time. Navigation, not flight. -->
      <div id="bar" class="bar">
        <button id="play" type="button" aria-label="pause">❚❚</button>
        <!-- Shown when there is licensed sound to play: mutes it. -->
        <button id="sound" type="button" aria-label="mute" hidden>♪</button>
        <div id="chapters" class="chapters"></div>
        <span id="time" class="time">0:00 / 0:00</span>
        <a class="creditsLink" href="./credits.html">Credits</a>
      </div>
      <!-- Touch: two held buttons for speed; the drag for direction is the canvas itself. -->
      <div class="touch">
        <button id="slower" type="button" aria-label="slower">−</button>
        <button id="faster" type="button" aria-label="faster">+</button>
      </div>
      <div id="hint" class="hint"></div>
      <!-- Phones play in landscape; in portrait the film asks and waits. -->
      <div id="rotate" class="rotate"><div>Turn your phone sideways.</div></div>
      <!-- Frame time by wall clock: ?frametime. -->
      <div id="frametime" class="frametime" hidden></div>
      <!-- The rail recorder, dev only: ?record=<scene-id>. -->
      <div id="recorder" class="recorder" hidden></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
