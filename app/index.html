<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nine Skies — prototype</title>
    <link rel="stylesheet" href="./src/hud.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="block primary">
        <div class="row"><span class="label">ALT</span><span class="value" id="alt">—</span><span class="unit">m</span></div>
        <div class="row"><span class="label">GND</span><span class="value" id="gnd">—</span><span class="unit">m</span></div>
        <div class="row"><span class="label">TEMP</span><span class="value" id="temp">—</span><span class="unit">°C</span></div>
        <div class="row"><span class="label">HUM</span><span class="value" id="hum">—</span><span class="unit">%</span></div>
        <div class="row density">
          <span class="label">AIR</span>
          <span class="bar"><i id="densityBar"></i></span>
          <span class="unit" id="densityText">—</span>
        </div>
        <div class="row"><span class="label">CLIMB</span><span class="value" id="climb">—</span><span class="unit">m/s</span></div>
      </div>
      <div class="block mode">
        <span id="mode">CRUISE</span>
        <span id="boostState" class="muted">boost ready</span>
        <span id="ground" class="muted">—</span>
      </div>
      <div class="block debug">
        <div id="fps">— fps</div>
        <div id="draws">—</div>
        <div id="tris">—</div>
        <div id="horizon">—</div>
        <div id="world">—</div>
        <div id="scaleText">—</div>
        <div id="pace">—</div>
        <div id="device">—</div>
        <div id="comfort">—</div>
        <div id="expedition">—</div>
        <div id="profile">—</div>
        <div id="journal">—</div>
        <div id="clock">—</div>
        <div id="challenge" hidden>—</div>
      </div>
      <!-- The map overlay (F42). Hidden until M. Two canvases rather than one
           because the profile has its own aspect and its own vertical scale,
           and drawing them together would mean one of them lying about it. -->
      <div class="map" id="map" hidden>
        <canvas id="mapCanvas" width="760" height="520"></canvas>
        <canvas id="profileCanvas" width="760" height="110"></canvas>
      </div>

      <!-- A narration beat, held by the single-card queue. Placeholder: what a
           beat looks like to a player is the journal's question (F38). -->
      <div class="block beat" id="beat"></div>
      <!-- Filled from the binding table at boot, so it cannot disagree with the keys. -->
      <div class="block help" id="help"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
