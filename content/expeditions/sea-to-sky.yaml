# Expedition 1 — Sea to Sky.
#
# The speed profile is not a preference. Finding F17: flown at cruise from end
# to end this route puts the aircraft into the ground 1,846 km out, 321 m
# below a ridge west of Chengdu, twelve minutes after leaving Shanghai. The
# route clears at 73 km/min and not above, which is a 32-minute trip — so
# there is no single cruise speed that both flies it and fits the GDD's
# fifteen-to-thirty-five minute band, and the shipped 130 is not close.
#
# What flies is `low / low / cruise / cruise`: 35.5 minutes, clearing the
# worst ground by 333 m, arriving over Lhasa at 6,010 m.
#
# Two things about it are counter-intuitive enough to be worth writing down,
# because both look like mistakes to anyone tidying this file later.
#
#   The slow legs are the FLAT ones. Climbing costs minutes, not kilometres —
#   reaching 5,858 m takes 32.1 minutes of flying whatever speed the ground
#   goes past underneath (F16's asymmetry). The only place to buy those
#   minutes is the eastern plain, where there are 1,427 km of nothing in the
#   way. Speed the east up and the aircraft arrives at the Hengduan too low,
#   and no amount of slowing down afterwards recovers it: the wall west of
#   Chengdu rises 37 m for every kilometre of ground, which at cruise asks for
#   80 m/s of climb from an aircraft that gives 6.
#
#   `boost` west of Chongqing is a no-op. It is gated on air density and cuts
#   out at 3,564 m, which by then is below the aircraft. Writing `boost` on
#   those legs is asking for something the atmosphere will not give.
#
# `test/route/seaToSkyClearance.test.ts` flies exactly this file over the
# built corridor and fails if any of it stops being true.

id: sea-to-sky
name: Sea to Sky
contrast: Low, wet and crowded to high, dry and empty
teaches: The three steps, and why the west is sparse

# Late autumn: thick Sichuan fog at the start, a clear plateau at the end.
month: 11
# Beijing time, the only time zone China has. Leaving Shanghai just after
# sunrise puts Lhasa in the early afternoon by the clock and mid-morning by
# the sun, which is the lesson the HUD clock is there to teach.
start_hour: 7
start_altitude_m: 1200

route:
  - { id: shanghai, name: Shanghai, zh: 上海, lat: 31.23, lon: 121.47 }
  - { id: wuhan, name: Wuhan, zh: 武汉, lat: 30.59, lon: 114.31, speed: low }
  - { id: chongqing, name: Chongqing, zh: 重庆, lat: 29.57, lon: 106.55, speed: low }
  - { id: chengdu, name: Chengdu, zh: 成都, lat: 30.66, lon: 104.07, speed: cruise }
  - { id: lhasa, name: Lhasa, zh: 拉萨, lat: 29.65, lon: 91.10, speed: cruise }
