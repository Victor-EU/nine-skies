# The Eight Immortals (D91) crossing the sea, over Ayding Lake.

figure: baxian

subject: >-
  The Eight Immortals crossing the sea, each by their own art: Tieguai Li,
  a lame beggar with an iron crutch and a gourd on his back; Zhongli Quan,
  stout and bare-bellied with a great fan; Lü Dongbin, a scholar with a
  sword across his back; Zhang Guolao, an old man riding a white donkey
  backwards with a fish drum; He Xiangu, a young woman holding a lotus;
  Lan Caihe, a youth with a flower basket; Han Xiangzi, a young man
  playing a flute; Cao Guojiu, in court dress with jade clappers. Each
  stands on their own small drift of real cloud.

views:
  default:
    size: 1536x1024
    pose: >-
      All eight in a loose line abreast, travelling toward the right of the
      picture, three-quarter view, spaced so each is clear. The whole company
      in the picture.
  # Another picture of it (F142).
