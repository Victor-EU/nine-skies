# The carp (D91) that leaps the Dragon Gate and becomes a dragon.

figure: carp

subject: >-
  The carp that leaps the Dragon Gate on the Yellow River and becomes a
  dragon: a great golden-red carp, heavy scales edged in gold, a pale
  belly, long barbels, round gold eyes, fins of translucent orange like
  silk, a forked tail. It leaps out of a burst of spray and real
  cloud.

views:
  default:
    size: 1536x1024
    pose: >-
      Leaping toward the right of the picture in an arc, side view, body
      curved, tail beating, spray and cloud falling away beneath it. The whole
      fish in the picture.
  # Another picture of it (F142).
  arch:
    size: 1536x1024
    pose: >-
      The same figure as in the reference picture, its design,
      colours, dress and light kept exactly; only the pose is new. At
      the very top of its leap over the Dragon Gate, side view, its
      body arched over like a drawn bow with the head turning down
      toward the right of the picture, every fin spread, water
      streaming from it in bright threads; its long barbels already
      lengthening like a dragon's whiskers. The whole fish in the
      picture.
