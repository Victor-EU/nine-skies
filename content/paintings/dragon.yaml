# The dragon of the cloud seas and rivers (D91): the classical long of the
# nine resemblances, no wings, riding the cloud. The East King is drawn
# first; the other kings, the White Dragon and the Jing River's are drawn
# from him (`--ref`), so the family is one design in its liveries. The
# four kings together over Huangshan for their line (`four-kings`) are one
# picture: `gathering` drawn from the four kings, then its pick with only
# the South King's crown made the Monkey King's (F133). The Uyghur dragon
# of the Flaming Mountains (`slain`) is drawn from the East King too, in
# the red of the range his blood stained, lying dead along the picture.

figure: dragon

subject: >-
  A Chinese dragon, the classical long of the nine resemblances: a long
  serpent's body swimming through the air in painted S-curves, a camel-like
  head with branching deer antlers, a flowing mane and long whiskers, eyes
  like a hare's that burn, four legs each with four taloned claws, a crest
  of fins along the spine, and no wings: it rides the cloud. Heavy real
  scales like a great carp's, catching the light. Wisps of real cloud
  trail from its body and coils.

views:
  east-king:
    size: 1536x1024
    pose: >-
      The Dragon King of the Eastern Sea, ancient and immense: scales of deep
      jade green, a pale gold belly, an amber mane. Rising out of cloud in one
      great S-curve from the lower left to the upper right, head raised and
      turned toward the right of the picture, jaws parted, one foreclaw
      reaching forward. The whole length of the dragon in the picture, head
      to tail.
  south-king:
    size: 1536x1024
    pose: >-
      Keep the dragon in the reference picture exactly: its design, pose,
      composition, framing and light. Change only its colours: the Dragon
      King of the Southern Sea, scales of deep vermilion red, a pale apricot
      belly, a gold mane.
  west-king:
    size: 1536x1024
    pose: >-
      Keep the dragon in the reference picture exactly: its design, pose,
      composition, framing and light. Change only its colours: the Dragon
      King of the Western Sea, scales of cold silver with a pearl sheen, a
      pale belly, a blue-grey mane.
  north-king:
    size: 1536x1024
    pose: >-
      Keep the dragon in the reference picture exactly: its design, pose,
      composition, framing and light. Change only its colours: the Dragon
      King of the Northern Sea, scales of blue-black iron, a slate-grey
      belly, a dark grey mane.
  white:
    size: 1536x1024
    pose: >-
      Keep the dragon in the reference picture exactly: its design, pose,
      composition, framing and light. Change it into the White Dragon of
      Eagle Grief Stream, the Western Sea King's young son: slimmer and
      younger, scales of pure white with a pearl sheen, a cream belly, a
      pale gold mane.
  dust:
    size: 1536x1024
    pose: >-
      Keep the dragon in the reference picture exactly: its design, pose,
      composition, framing and light. Change it into the Dragon King of the
      Jing River: scales the ochre-brown of loess dust, a pale sand belly, a
      dark umber mane, and dust streaming from his coils like smoke.
  gathering:
    size: 1536x1024
    pose: >-
      The four Dragon Kings of the Four Seas together, four brothers of the
      one design in the reference pictures, each in his own livery exactly
      as there, rising side by side out of one long low bank of cloud along
      the bottom of the picture. Each is a whole dragon, head to tail, in a
      pose of his own, so that the four read apart even when the picture is
      small; all four heads turned toward the right of the picture. Foremost
      and largest, right of centre, the Dragon King of the Eastern Sea in
      deep jade green with an amber mane, rearing up in a great S-curve,
      jaws parted. Higher on the left, the Dragon King of the Southern Sea in
      vermilion red with a gold mane, holding up in one foreclaw the purple-gold
      crown with phoenix wings, two long pheasant-tail plumes rising from
      it. Lower left, the Dragon King
      of the Western Sea in silver with a pearl sheen and a blue-grey mane,
      carrying in his foreclaws a cuirass of interlinked golden chain mail.
      Far right, the Dragon King of the Northern Sea in blue-black iron with
      a dark grey mane, holding out a pair of pale cloud-stepping boots woven
      of lotus-root fibre. Clear space between the four, their coils not
      knotted together.
  four-kings:
    size: 1536x1024
    pose: >-
      Keep the picture in the reference exactly: the four dragons, their
      designs, poses, colours, the cloud, the composition, framing and
      light, and what each holds. Change only the crown the red dragon
      holds up: make it the purple-gold crown with phoenix wings that the
      Monkey King wears in the Ming novel, a Chinese crown and not a
      European one: a close-fitting cap of gold tinged with purple, a
      flame-shaped plate rising at its front, a gold phoenix wing sweeping
      up from each side, and two very long pheasant-tail plumes rising from
      it and arching back. No arches, no cross, no orb, no jewels.
  slain:
    size: 1536x1024
    pose: >-
      The dragon of the Uyghur story of the Flaming Mountains, which the
      hero Kara Khoja slew: the same design as the dragon in the reference
      picture, its head, antlers, mane, whiskers, scales and claws, but
      its scales the deep rust red and burnt ochre of sun-baked red
      sandstone, cracked and dusty, a pale sand belly, a dark copper mane.
      It lies dead and still, stretched out long and low across the whole
      width of the picture in slow shallow waves, the way a range of hills
      lies on a plain: its head at the right laid low on its forelegs, eyes
      closed, jaws shut, whiskers and mane hanging slack; its legs folded
      under it; its long tail trailing out to the far left. Heat haze and
      thin wisps of smoke rising off its back, as off hot rock. No blood,
      no wounds. The whole length of the dragon in the picture, head to
      tail.
