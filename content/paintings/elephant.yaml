# The elephant of heaven (D91), Guilin's Elephant Trunk Hill, which stayed
# on the Li to drink.

figure: elephant

subject: >-
  The elephant of heaven from the legend of Guilin's Elephant Trunk Hill,
  the Emperor of Heaven's mount: a great Asian elephant, grey-white and
  ancient, its skin deeply wrinkled, short tusks, ears swinging, its trunk
  curled forward as if to drink from the air. A caparison of crimson and
  gold brocade over its back with tassels and a fringed edge, and a
  jewelled headpiece. It walks on air, each foot on a small drift of real
  cloud.

views:
  default:
    size: 1536x1024
    pose: >-
      Three-quarter side view, walking toward the right of the picture. The
      whole animal, trunk to tail.
  # Another picture of it (F142).
  drink:
    size: 1536x1024
    pose: >-
      The same figure as in the reference picture, its design,
      colours, dress and light kept exactly; only the pose is new.
      Halted, three-quarter side view, facing the right of the
      picture, its head lowered and the trunk curled down and forward
      as if drinking from the river far below, ears spread. The whole
      animal, trunk to tail.
