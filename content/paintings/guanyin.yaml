# Guanyin of the South Sea (D97), over the Karst: she is drawn herself,
# as the novel (ch. 8) and the temples show her, with the vase and willow
# and the white parrot. Until 29 September 2026 the film drew her empty
# seat instead (D91).

figure: guanyin

subject: >-
  Guanyin of the South Sea, the Bodhisattva of Compassion, as the novel
  Journey to the West describes her and the temples show her: a woman of
  serene, grave beauty with a calm jade-pale face, downcast eyes and a
  faint smile, her black hair coiled high in a topknot under a flowing
  white hood, a small crown at its front. A long robe of plain white silk
  falls to her bare feet, with jade buttons and a sash of soft gold cord;
  strings of pearls and kingfisher-blue beads at her breast. In her left
  hand a white porcelain vase of pure water; her right hand holds a slender
  sprig of green willow from it. She stands on a great open lotus flower
  of pale pink and white petals, carved and real, resting on a bank of
  real white cloud. A white parrot flies close by her shoulder. Dignified,
  reverent and still, not sweet, not a doll.

views:
  default: >-
    Standing, three-quarter view, turned slightly toward the right of the
    picture, eyes lowered to the right. Full length, hood to lotus and
    cloud, the parrot in the air above her right shoulder.
