# Guanyin's seat (D91): she is worshipped, so the film draws her empty
# lotus throne, the vase and willow, and the white parrot, never her.

figure: guanyin

subject: >-
  The seat of Guanyin, the Bodhisattva of Compassion, shown without her, as
  early Buddhist art showed the Buddha by an empty seat: an empty lotus
  throne of pale pink and white petals, carved and real, resting on a bank
  of real white cloud. On the throne stands a white porcelain vase of pure
  water with a sprig of green willow in it. A white parrot flies close
  above the throne. No person, no figure, no face, no hands: the throne is
  empty.

views:
  default: >-
    Seen from slightly below, three-quarter view. The whole throne, the
    vase, the parrot and the cloud in the picture.
