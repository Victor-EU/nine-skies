# Jingwei (D91), the drowned daughter who fills the sea twig by twig.

figure: jingwei

subject: >-
  Jingwei, the bird of the Classic of Mountains and Seas, the Yan Emperor's
  daughter who drowned in the Eastern Sea and became a bird that carries
  twigs and pebbles to fill it: a crow-like bird, dark and sleek, a
  patterned head of fine white markings, a white bill and red feet, a
  small twig held in the bill. Real feathers.

views:
  default:
    size: 1536x1024
    pose: >-
      In flight toward the right of the picture, three-quarter side view,
      wings spread in a strong downbeat. The whole bird.
  # Another picture of it (F142).
  glide:
