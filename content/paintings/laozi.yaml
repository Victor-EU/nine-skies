# Laozi, Taishang Laojun (D97), riding his green ox west out of the Hangu
# Pass, the purple air come before him; beside the Loess, where the monk
# rides west too. The old sage of the painters, not the enthroned Daode
# Tianzun of the altar.

figure: laozi

subject: >-
  Laozi, the Most High Lord Lao, as Chinese painting has shown him leaving
  through the Hangu Pass: a very old man, calm and wise, with a high bald
  domed brow, long white eyebrows that fall past his eyes, a long white
  beard to his chest, in a plain loose robe of undyed hemp and a dark blue
  over-robe, his white hair in a small knot held by a wooden pin. A
  horsetail fly-whisk rests over his shoulder and a dried gourd hangs at
  his waist. He sits at ease, sideways, on a folded cloth on the back of
  his green ox: a great placid ox with a deep slate blue-green hide, the
  colour called qing, and long horns swept back, led by nothing but a
  loose rope. Under the ox's hooves a soft drift of real cloud, lit with a
  faint violet glow: the purple air of the story. Serene and grave in
  tone, not comic, not a wizard.

views:
  default:
    size: 1536x1024
    pose: >-
      The ox walking slowly toward the right of the picture, three-quarter
      side view, the old man turned a little toward the viewer. Ox and
      rider whole in the picture, horns to tail, the violet cloud under
      the hooves trailing out behind to the left.
