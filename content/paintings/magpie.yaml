# The magpie (D91) of the Manchu origin story at Changbai's lake.

figure: magpie

subject: >-
  The magpie of the Manchu origin story, which dropped a red fruit for the
  youngest of three maidens bathing in Changbai's lake: an Oriental
  magpie, black head, back and breast with a blue-green sheen, a white
  belly and white shoulder patches, white flashes in the wings, a long
  blue-black tail. A round red fruit held in its beak. Real feathers.

