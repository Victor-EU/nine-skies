# Miyolangsangma's mount (D91): the goddess of Chomolungma is worshipped,
# so the film draws her golden tigress with the empty saddle and the bowl,
# never her.

figure: miyolangsangma

subject: >-
  The mount of Miyolangsangma, the goddess of Chomolungma, shown without
  her: a golden tigress walking the air, her coat gold with darker
  stripes, muscular and calm, an ornate saddle cloth of red, blue and gold
  on her back, empty. On the saddle cloth rests a bowl heaped with food,
  the goddess's gift without end. No person, no rider, no figure: the
  saddle is empty. Each paw on a small drift of real cloud.

views:
  default:
    size: 1536x1024
    pose: >-
      Walking toward the right of the picture, three-quarter side view, head
      raised. The whole animal.
  # Another picture of it (F142).
  rest:
    size: 1536x1024
    pose: >-
      The same figure as in the reference picture, its design,
      colours, dress and light kept exactly; only the pose is new. The
      tigress lying down at rest on the cloud, facing the right of the
      picture, three-quarter side view, forepaws stretched out before
      her, head raised and calm, the empty saddle cloth and the heaped
      bowl still on her back. No person, no rider: the saddle is
      empty. The whole animal.
