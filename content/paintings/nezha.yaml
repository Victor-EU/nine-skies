# Nezha (D91), the Third Prince, on the Wind-Fire Wheels: over Huangshan
# after the monkey (ch. 4), over the Flaming Mountains at the fight's end.

figure: nezha

subject: >-
  Nezha, the child god of the Ming novels, the Third Prince of Li Jing: a
  slight, fierce boy of about twelve, his face calm and dangerous, his hair
  in two buns tied with red cords. A red silk bib, a skirt of lotus leaves,
  bare arms; the golden Universe Ring on his right wrist; the Fire-Tipped
  Spear in his hand, its point burning; the long red Sky-Muddling Silk
  sash streaming behind him in a great loop. He stands on the Wind-Fire
  Wheels, a spinning gold ring wreathed in real fire under each foot.

views:
  default: >-
    Three-quarter view, leaning into a turn toward the right of the
    picture, the spear held low and forward, the sash streaming out behind
    to the left. Full length, buns to wheels.
