# The Bull Demon King (D91) as the white bull of the fight's end (ch. 61),
# Nezha's fire wheel on his horn.

figure: niumowang

subject: >-
  The Bull Demon King of Journey to the West in the form he took when the
  fight at the Flaming Mountains was lost: a colossal white bull, horns
  like two iron towers curving out and up, eyes like lightning, a heavy
  hump and dewlap, a broad pale muzzle. On his right horn hangs Nezha's
  Wind-Fire Wheel, a gold ring wreathed in real flame. His hooves tread on
  a drift of real cloud.

views:
  default:
    size: 1536x1024
    pose: >-
      Walking toward the right of the picture, three-quarter side view, head
      tossing, beaten but still dangerous. The whole animal, horns to
      tail.
  # Another picture of it (F142).
  horns:
    size: 1536x1024
    pose: >-
      The same figure as in the reference picture, its design,
      colours, dress and light kept exactly; only the pose is new.
      Stopped short, facing the right of the picture, three-quarter
      side view, his great head lowered with the horns thrust forward,
      bellowing, one forehoof pawing the cloud; Nezha's wheel still
      burning on his right horn. The whole animal, horns to tail.
