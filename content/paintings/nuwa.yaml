# Nüwa mending the sky (D98), over the Roof's first leg, where the wind
# horse's flags flew. The Huainanzi, whose nine fields are the film's nine
# skies, tells it: Gonggong broke the pillar, the sky tilted to the
# north-west, the Roof's own sky, and Nüwa smelted stones of five colours
# to mend it. As the Han reliefs show her, a woman to the waist and a
# serpent below; the stone in her hands is the story's, not the flags'.

figure: nuwa

subject: >-
  Nüwa, the ancient mother goddess of Chinese myth who mended the broken
  sky, as the Han tomb reliefs and later Chinese painting show her: a
  woman from the waist up and a great serpent below. A grave, strong,
  ageless face, calm and intent; her black hair gathered in a high knot
  of the Han manner with a plain jade pin, loose strands lifting in the
  wind. She wears a wrapped robe of the Han dynasty, crossed at the
  collar, in undyed silk and deep ochre, its wide sleeves falling back
  from her arms, a long pale ribbon of silk streaming from her shoulders.
  Below the robe's hem at her waist her body becomes a long, heavy
  serpent's body, thick as a python's, with real scales of dark bronze
  and jade green and a paler belly, curving behind her in one great
  S-shaped coil to a tapering tail. In both raised hands she lifts a
  rough stone the size of a melon that glows from within like metal just
  out of the furnace, streaked with five colours, blue-green, red,
  yellow, white and black, a little smoke and sparks trailing from it.
  Wisps of real cloud about her coils. Primordial, dignified and
  powerful, fully clothed; not glamorous, not a mermaid, not a lamia, not
  a naga of Indian art, not a monster.

views:
  default:
    size: 1536x1024
    pose: >-
      Rising through the air toward the upper right of the picture,
      three-quarter side view, her face and the stone turned up toward the
      right, both arms raised ahead of her head holding the glowing stone.
      Her whole serpent body trails out behind her to the lower left in a
      long S-curve, the tail's tip curling. Woman and serpent whole in the
      picture, stone to tail tip.
