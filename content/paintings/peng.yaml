# The Peng (D91): Zhuangzi's bird, and the Golden-Winged Peng of Lion
# Camel Ridge.

figure: peng

subject: >-
  The Peng, the vast bird of Zhuangzi whose wings are like clouds hanging
  from the sky, and the Golden-Winged Great Peng of Lion Camel Ridge: a
  colossal eagle of gold, far larger than any living bird: feathers of
  burnished metallic gold like beaten foil, a crest of long golden plumes
  swept back from the head, a hooked beak, eyes of molten gold under a
  heavy brow, a long body, two immense wings with dark tips, a fanned
  tail, talons tucked under.

views:
  default:
    size: 1536x1024
    pose: >-
      Soaring toward the right of the picture, three-quarter view from
      slightly below, wings fully spread and a little banked. The whole bird,
      wingtip to wingtip.
