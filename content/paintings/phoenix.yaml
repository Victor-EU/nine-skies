# The fenghuang (D91), the phoenix of the south, over the Li.

figure: phoenix

subject: >-
  The fenghuang, the phoenix of the south, seen when the world is at
  peace: a great pheasant-like bird of five colours, a red body, a golden
  breast, a crest of three beaded plumes, broad feathered wings, and five
  long tail plumes of red, gold, green, blue and purple streaming behind
  in waving curves, each ending in an eye like a peacock's. Real feathers,
  iridescent and fine.

views:
  default:
    size: 1536x1024
    pose: >-
      In flight toward the right of the picture, three-quarter side view,
      wings raised mid-beat, the tail plumes flowing out behind to the left.
      The whole bird, beak to plume tips.
