# The qilin (D91), the beast of good omen, on the Roof.

figure: qilin

subject: >-
  A qilin, the beast of good omen that walks on air and treads on nothing
  living: a deer's body covered in golden scales, a dragon's head with two
  antlers and a flowing beard, a green mane, cloven hooves, flames licking
  from its shoulders and hocks, an ox's tail with a green tuft. Each hoof
  on a small drift of real cloud.

views:
  default:
    size: 1536x1024
    pose: >-
      Walking toward the right of the picture, three-quarter side view, head
      raised. The whole animal.
