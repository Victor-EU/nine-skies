# Sanduo's mount (D91): the Naxi god is the snow mountain itself, so the
# film draws his white horse, riderless, and his standard, never him.

figure: sanduo

subject: >-
  The mount of Sanduo, the Naxi god of Jade Dragon Snow Mountain, shown
  without him: a powerful white horse saddled in white and gold, walking
  the air with no rider. Upright at the saddle, a white spear with a long
  white pennant streaming from it in the wind. No person, no rider, no
  figure: the saddle is empty. Each hoof on a small drift of real
  cloud.

views:
  default:
    size: 1536x1024
    pose: >-
      Walking toward the right of the picture, three-quarter side view, head
      high. The whole horse, the spear and the pennant in the picture.
  # Another picture of it (F142).
  rear:
    size: 1536x1024
    pose: >-
      The same figure as in the reference picture, its design,
      colours, dress and light kept exactly; only the pose is new. The
      white horse rearing on its hind legs toward the right of the
      picture, forelegs pawing the air, mane flying, the white pennant
      streaming from the upright spear at the empty saddle. Three-
      quarter side view. No person, no rider: the saddle is empty. The
      whole horse, the spear and the pennant in the picture.
