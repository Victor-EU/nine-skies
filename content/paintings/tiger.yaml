# The tiger (D91) of Tiger Leaping Gorge, and of Wukong's kilt.

figure: tiger

subject: >-
  A great South China tiger walking on air, the tiger of Tiger Leaping
  Gorge and the one whose skin Wukong wears as a kilt: heavy and muscular,
  a deep orange coat with black stripes, a pale belly and muzzle, round
  ears, gold eyes, the character 王 in the stripes of its brow, a long
  tail with a black tip. Each paw treads on a small drift of real
  cloud.

views:
  default:
    size: 1536x1024
    pose: >-
      Prowling toward the right of the picture, three-quarter side view, head
      low, shoulder blades rolling. The whole animal, nose to tail tip.
