# The old turtle of the Tongtian River (D91), who carried the pilgrims.

figure: turtle

subject: >-
  The old turtle of the Tongtian River who carried the pilgrims over on his
  back: an enormous ancient soft-shelled turtle, a broad domed shell with a
  leathery rim, patches of moss and water weed on it, a pale plastron, a
  long neck with the soft-shell's tube of a snout, four broad flippers
  rowing the air, a short tail. Water drips from him.

