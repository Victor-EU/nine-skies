# Sun Wukong, as the Ming novel dresses him in the years of the havoc in
# heaven: the crown and plumes, not the golden fillet he wears as a
# pilgrim, since Nezha is sent after him over Huangshan (01) and he is
# still the rebel at the First Bend (04) and over Turpan (07).

figure: wukong

subject: >-
  Sun Wukong, the Monkey King of the Ming novel Journey to the West, in the
  years he made havoc in heaven. A lean, wiry, powerful monkey with
  realistic golden-brown fur, a bare weathered face with sharp amber eyes
  and a fierce, knowing intelligence. He wears the purple-gold crown with
  phoenix wings, two very long pheasant-tail plumes rising from it and
  arching back; a coat of golden chain-link armour over a red silk
  under-robe, worn and battle-used rather than new; a tiger-skin kilt
  belted at the waist; cloud-stepping boots. On his shoulder rests his
  staff, a heavy black iron rod banded with gold at both ends. He stands
  on his somersault cloud, a small, dense, luminous knot of real white
  cloud whose edges fray into wisps and vanish.

views:
  # The companion over Huangshan, turned toward the camera, scouting.
  default: >-
    Seen from slightly below, three-quarter view, body turned toward the
    viewer. One hand raised flat to his brow, shading his eyes, scouting
    into the far distance past the viewer's right. Weight on one leg,
    poised and alert, the other foot light on the cloud. Full length,
    crown plumes to cloud.
