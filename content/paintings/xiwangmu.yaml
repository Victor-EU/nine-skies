# The Queen Mother of the West (D91), from her Jade Pool on Bogda, over
# the first leg of Below the Sea, with the three blue birds.

figure: xiwangmu

subject: >-
  Xiwangmu, the Queen Mother of the West, as Han and Ming painting show
  her: a regal woman of great age and ageless face, serene and stern, in a
  court robe that falls to her feet, wide sleeves of gold brocade, a jade
  belt; her hair in a tall coiffure crowned with the sheng headdress, a
  horizontal bar with a disc at each end. In one hand a ripe peach of
  immortality. She stands on a bank of real white cloud. Three blue birds
  of the Classic of Mountains and Seas, lean and swift with long tails,
  fly about her.

views:
  default: >-
    Three-quarter view, turned slightly toward the right of the picture,
    looking out past the viewer's right. Full length, headdress to cloud,
    the birds close about her.
