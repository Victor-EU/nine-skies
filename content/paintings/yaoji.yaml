# Yao Ji (D91), the Goddess of Wu Mountain, stood on Goddess Peak over
# the Wu Gorge; a monument, she never leaves it.

figure: yaoji

subject: >-
  Yao Ji, the Goddess of Wu Mountain, the Red Emperor's daughter who became
  the morning cloud and the evening rain over the Wu Gorge: a young woman
  of quiet authority in layered robes of jade green and white silk, her
  hair in two high loops, two long white ribbons streaming from her
  shoulders in the wind. She stands on a drift of real cloud, one hand
  raised over the river below, palm down, as if stilling the rapids.

views:
  default: >-
    Three-quarter view, turned toward the right of the picture, looking
    down and to the right. Full length, hair to cloud, the ribbons curling
    out behind her to the left.
