# Scene 1 — Huangshan.
#
# The film opens on the granite massif in a sea of cloud at dawn (decided
# 23 September 2026 over the estuary, which was flat). Hand-typed: a loop
# from the south over Lotus Peak, round the north side and back over the
# east, slow, so a viewer at double speed still has the massif under them.
# The cloud deck lies at 1,050 m; the peaks stand 600-800 m out of it. The
# altitude reads only 1.5 km ahead here (F81): keys over the massif fly 150 m
# over the highest ground in that reach, which over the ridge lines is 1,800
# to 1,900 m, so the spires ahead cross the horizon instead of lying under
# the frame; keys round the flanks fly 800 m up, clear of the deck.

id: huangshan
title: { zh: 黄山, pinyin: Huángshān, en: Huangshan }
# The sky's name in the Huainanzi's nine fields, the east (D91); on the card when the cast is on.
heaven: { zh: 苍天, pinyin: Cāngtiān, en: the azure sky }
line: "Granite peaks above a sea of cloud."
hero: huangshan
month: 11
hour: 7.3

rail:
  - { lat: 30.0500, lon: 118.1550, above_ground_m: 800, speed: 22 }   # in from the south, the peaks already ahead
  - { lat: 30.0700, lon: 118.1600, above_ground_m: 800, speed: 22 }
  - { lat: 30.1100, lon: 118.1650, above_ground_m: 150, speed: 22 }   # the southern peaks
  - { lat: 30.1320, lon: 118.1690, above_ground_m: 150, speed: 22 }   # Lotus Peak
  - { lat: 30.1550, lon: 118.1750, above_ground_m: 150, speed: 22 }   # Bright Summit, the north
  - { lat: 30.1800, lon: 118.1900, above_ground_m: 150, speed: 22 }
  - { lat: 30.1950, lon: 118.2200, above_ground_m: 800, speed: 22 }   # round the north-east
  - { lat: 30.1750, lon: 118.2450, above_ground_m: 800, speed: 22 }
  - { lat: 30.1400, lon: 118.2500, above_ground_m: 800, speed: 22 }   # down the east side
  - { lat: 30.1000, lon: 118.2350, above_ground_m: 800, speed: 22 }
  - { lat: 30.0700, lon: 118.2000, above_ground_m: 800, speed: 22 }   # the south-east
  - { lat: 30.0800, lon: 118.1500, above_ground_m: 800, speed: 22 }
  - { lat: 30.1150, lon: 118.1300, above_ground_m: 800, speed: 22 }   # up the west side
  - { lat: 30.1500, lon: 118.1350, above_ground_m: 800, speed: 22 }
  - { lat: 30.1750, lon: 118.1550, above_ground_m: 150, speed: 22 }
  - { lat: 30.1600, lon: 118.1950, above_ground_m: 150, speed: 22 }   # back over the top
  - { lat: 30.1300, lon: 118.2100, above_ground_m: 150, speed: 22 }
  - { lat: 30.1000, lon: 118.1900, above_ground_m: 150, speed: 22 }
  - { lat: 30.0800, lon: 118.1600, above_ground_m: 800, speed: 22 }
  - { lat: 30.1100, lon: 118.1450, above_ground_m: 150, speed: 22 }
  - { lat: 30.1450, lon: 118.1600, above_ground_m: 150, speed: 22 }   # and once more over Lotus Peak
  - { lat: 30.1750, lon: 118.2150, above_ground_m: 150, speed: 22 }
  - { lat: 30.1500, lon: 118.2400, above_ground_m: 800, speed: 22 }
  - { lat: 30.1150, lon: 118.2300, above_ground_m: 800, speed: 22 }

band: { above_ground_m: [150, 1500] }
pitch_deg: 10
corridor_deg: 90
look_ahead_km: 1.5

look:
  sky: huangshan-dawn
  palette: granite-pine
  cloud: cloud-sea
  grade: warm

# The cast (D91), when the viewer has it on: Havoc in Heaven (ch. 3-7).
# The cloud sea is the East Sea, and the four Dragon Kings surface from it
# round the massif, each where a pass of the loop looks across at him:
# the East King north of Lotus Peak, the South King off the start, the
# West King off the west flank, the North King over the north. Each comes
# up and goes under on his own timing, as the flight looks his way, and
# the cranes scatter before him (D93). Wukong
# rides beside the camera with the cranes, looking back; Nezha comes
# after him from half way, the chase of ch. 4.
cast:
  - figure: dragon
    variant: east-king
    role: monument
    at: { lat: 30.165, lon: 118.205, above_ground_m: 700 }
    size_m: 1500
    facing_deg: 250
    from: 6
    until: 108
    name_zh: 四海龙王
    line: "The four Dragon Kings, up from the cloud sea with Wukong's gifts."
    line_at: 20
  - figure: dragon
    variant: south-king
    role: monument
    at: { lat: 30.095, lon: 118.205, above_ground_m: 700 }
    size_m: 1800
    facing_deg: 300
    from: 4
    until: 110
  - figure: dragon
    variant: west-king
    role: monument
    at: { lat: 30.135, lon: 118.115, above_ground_m: 800 }
    size_m: 1800
    facing_deg: 120
    from: 4
    until: 110
  - figure: dragon
    variant: north-king
    role: monument
    at: { lat: 30.215, lon: 118.175, above_ground_m: 1000 }
    size_m: 1800
    facing_deg: 180
    from: 4
    until: 110
  - figure: cranes
    variant: still
    role: companion
    offset: { ahead_m: 700, right_m: 240, up_m: -30 }
    size_m: 260
    facing_deg: 45
    from: 6
    until: 108
  - figure: wukong
    variant: still
    role: companion
    offset: { ahead_m: 600, right_m: -170, up_m: -10 }
    size_m: 130
    facing_deg: 150
    from: 12
    until: 100
    name_zh: 孙悟空
    line: "Sun Wukong, the Monkey King, scouting from his somersault cloud."
    line_at: 32
  # Where he is drawn as big as he was at 900 m and 240 m, so that after the
  # monkey, beside him, he is about his size and not twice it (F130).
  - figure: nezha
    variant: still
    role: companion
    offset: { ahead_m: 525, right_m: -222, up_m: 23 }
    size_m: 140
    facing_deg: 120
    from: 40
    until: 104
    name_zh: 哪吒
    line: "Nezha on his wind-fire wheels, sent to bring the monkey in."
    line_at: 62

captions:
  - { at: 8, text: "Huangshan. Granite, pines, and cloud filling every valley below." }
  - { at: 50, text: "The peaks stand at {1800 m}; the cloud lies at {1200 m}." }
  - { at: 96, text: "Painters came here for a thousand years. Now west, to the river." }

music: cue-01
