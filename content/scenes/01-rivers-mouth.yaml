# Scene 1 — The River's Mouth.
#
# Out of the East China Sea at dawn and up the estuary past Chongming, then
# the river inland to the Poyang. Hand-typed: Natural Earth draws the Yangtze
# only from Zhenjiang upstream, and the estuary is the point. Provisional
# until the rough cut is watched (design v2): either this earns the first slot
# or Huangshan does.

id: rivers-mouth
title: { zh: 长江口, pinyin: Chángjiāng kǒu, en: The River's Mouth }
line: "The sea, then the widest river you have seen."
# hero: none; the country grid alone
month: 11
hour: 7

rail:
  - { lat: 31.0500, lon: 122.6000, above_ground_m: 400, speed: 150 }   # over the East China Sea
  - { lat: 31.3000, lon: 122.1000, above_ground_m: 400, speed: 150 }   # the estuary
  - { lat: 31.4500, lon: 121.5500, above_ground_m: 350, speed: 150 }   # Chongming
  - { lat: 31.7500, lon: 121.1000, above_ground_m: 300, speed: 150 }
  - { lat: 32.0000, lon: 120.7500, above_ground_m: 300, speed: 150 }   # Nantong
  - { lat: 32.1000, lon: 120.3000, above_ground_m: 300, speed: 150 }
  - { lat: 32.2500, lon: 119.5500, above_ground_m: 300, speed: 150 }   # Zhenjiang
  - { lat: 32.0500, lon: 118.8000, above_ground_m: 300, speed: 150 }   # Nanjing
  - { lat: 31.5500, lon: 118.4500, above_ground_m: 300, speed: 150 }   # Wuhu
  - { lat: 30.9500, lon: 117.7500, above_ground_m: 300, speed: 150 }   # Tongling
  - { lat: 30.5200, lon: 117.0500, above_ground_m: 300, speed: 150 }   # Anqing
  - { lat: 29.8500, lon: 116.3000, above_ground_m: 300, speed: 150 }   # Hukou, where the Poyang meets it

band: { above_ground_m: [150, 900] }
corridor_deg: 60

look:
  sky: delta-dawn
  palette: delta-grey-green
  cloud: coastal-haze
  grade: warm

captions:
  - { at: 10, text: "The Yangtze, 6,300 kilometres from Tibet." }
  - { at: 50, text: "The east: low, wet, and full of people." }
  - { at: 90, text: "Nothing here is above 20 metres." }

music: cue-01
