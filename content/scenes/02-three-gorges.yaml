# Scene 2 — The Three Gorges.
#
# Yichang west up the Yangtze through Xiling, Wu and Qutang, below the rim
# for most of two minutes, on the 90 m hero grid (`three-gorges`). The rail
# runs on past Fengjie to Wanzhou so a viewer at double speed never runs out
# of river. Coordinates are the river's own course; `make rails` checks the
# ground under them.
#
# The camera is at 250 m over the water in the narrows and higher over the
# reservoir, which is what keeps it under the rim where there is one. Speed
# is chosen for the picture, not for any aircraft (D74).

