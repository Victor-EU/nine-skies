# Scene 3 — Karst.
#
# Guilin down the Li to Yangshuo at a walking pace, on the 30 m hero grid
# stage 0 cut (F76), then on past Pingle for slack. Hand-typed along the
# river's course from the map: Natural Earth's 1:10m rivers do not draw the
# Li.

id: karst
title: { zh: 漓江, pinyin: Lí Jiāng, en: Karst }
# The sky's name in the Huainanzi's nine fields, the south (D91); on the card when the cast is on.
heaven: { zh: 炎天, pinyin: Yántiān, en: the blazing sky }
line: "Limestone towers at eye level, and a river threading between them."
hero: guilin
month: 4
hour: 8.5

rail:
  - { lat: 25.2703, lon: 110.2947, above_ground_m: 200, speed: 30 }   # Guilin, Elephant Trunk Hill
  - { lat: 25.2200, lon: 110.3600, above_ground_m: 200, speed: 30 }
  - { lat: 25.1800, lon: 110.4200, above_ground_m: 180, speed: 30 }   # Daxu
  - { lat: 25.1300, lon: 110.4300, above_ground_m: 180, speed: 30 }
  - { lat: 25.0900, lon: 110.4400, above_ground_m: 180, speed: 30 }   # Caoping
  - { lat: 25.0300, lon: 110.4500, above_ground_m: 180, speed: 30 }
  - { lat: 24.9800, lon: 110.4500, above_ground_m: 180, speed: 30 }   # Yangdi
  - { lat: 24.9400, lon: 110.4900, above_ground_m: 180, speed: 30 }
  - { lat: 24.9000, lon: 110.5000, above_ground_m: 180, speed: 30 }   # Xingping
  - { lat: 24.8500, lon: 110.5100, above_ground_m: 180, speed: 30 }
  - { lat: 24.8100, lon: 110.5000, above_ground_m: 200, speed: 30 }
  - { lat: 24.7780, lon: 110.4960, above_ground_m: 200, speed: 30 }   # Yangshuo
  - { lat: 24.7200, lon: 110.5500, above_ground_m: 250, speed: 40 }
  - { lat: 24.6300, lon: 110.6400, above_ground_m: 300, speed: 40 }   # Pingle
  - { lat: 24.4500, lon: 110.7200, above_ground_m: 350, speed: 50 }
  - { lat: 24.1700, lon: 110.8100, above_ground_m: 400, speed: 50 }   # Zhaoping

band: { above_ground_m: [100, 800] }
corridor_deg: 70

look:
  sky: karst-mist
  palette: jade-limestone
  cloud: river-mist
  grade: cool

# The cast (D91): Gao Village (ch. 18-19) is a river village like the ones
# under these towers. The party walks the sky beside the camera, Bajie
# among them; a flock crosses the Li ahead, the cranes standing in for the
# river's egrets until those have a builder of their own.
cast:
  - figure: pilgrims
    variant: still
    role: companion
    offset: { ahead_m: 900, right_m: 320, up_m: -420 }
    size_m: 220
    facing_deg: 235
    from: 10
    until: 114
    name_zh: 取经人
    line: "Tang Sanzang and his disciples, walking west on a road of cloud."
    line_at: 26
  - figure: cranes
    variant: still
    role: companion
    offset: { ahead_m: 1200, right_m: -420, up_m: -360 }
    size_m: 480
    facing_deg: 60
    from: 20
    until: 100

captions:
  - { at: 15, text: "Each tower is sea floor, 300 million years old." }
  - { at: 60, text: "Rain did this. It is still doing it." }
  - { at: 100, text: "The Li, on its way to the Pearl River and Hong Kong." }

music: cue-03
