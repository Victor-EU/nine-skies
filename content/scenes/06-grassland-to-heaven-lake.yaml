# Scene 6 — Grassland to Heaven Lake.
#
# The steppe and Changbai's crater lake in one scene, by speed (decided
# 23 September 2026): east across the Xilingol grassland and the plain at
# the film's fastest, then the rail slows over the volcano and crosses the
# crater again and again for the rest of the time box, the lake ahead and
# below each time: a ring would look along its own tangent and never at the
# lake. The keys carry the pitch, six degrees over the grass and forty over
# the crater. At normal speed the crater arrives at
# about ninety seconds; at double speed at forty-five, with two laps of the
# rim to fly. At half speed it never arrives, which is the time box's rule.

id: grassland-to-heaven-lake
title: { zh: 草原到天池, pinyin: Cǎoyuán dào Tiānchí, en: Grassland to Heaven Lake }
line: "Grass to the horizon, then a volcano with a lake in it."
hero: changbai
month: 8
# 17:15 Beijing time: an evening sun of 20 degrees over the grass and 12
# over the crater. At 18:00 it was 4 over the crater, the light nearly
# orange and the lake in the rim's shadow (F83).
hour: 17.25

rail:
  - { lat: 43.7000, lon: 118.4000, above_ground_m: 500, speed: 550 }   # the Xilingol grassland
  - { lat: 43.6000, lon: 119.6000, above_ground_m: 500, speed: 550 }
  - { lat: 43.4500, lon: 120.9000, above_ground_m: 500, speed: 550 }   # over the Greater Khingan's foothills
  - { lat: 43.2500, lon: 122.2000, above_ground_m: 500, speed: 550 }
