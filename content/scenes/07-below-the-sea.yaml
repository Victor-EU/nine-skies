    line_at: 70

captions:
  - { at: 12, text: "Bogda: {5445 m} of snow over a desert." }
  - { at: 40, text: "Ayding Lake, {154 m} below the sea. {47 °C} in July." }
  - { at: 102, text: "The Taklamakan: go in, and you will not come out." }

