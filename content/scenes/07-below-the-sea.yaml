    line: "The Eight Immortals crossing the sea, each by their own art."
    line_at: 52
  - figure: pilgrims
    variant: still
    role: companion
    offset: { ahead_m: 1000, right_m: 360, up_m: -300 }
    size_m: 200
    facing_deg: 225
    from: 62
