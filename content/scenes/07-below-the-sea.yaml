# Scene 7 — Below the Sea.
#
# Off the Tian Shan at Bogda, down into the Turpan depression to Ayding Lake,
# then south-west across the Tarim basin over the Taklamakan's central dunes
# on their 90 m hero grid (F76), to Hotan.

id: below-the-sea
title: { zh: 吐鲁番, pinyin: Tǔlǔfān, en: Below the Sea }
# The sky's name in the Huainanzi's nine fields, the west (D91); on the card when the cast is on.
heaven: { zh: 颢天, pinyin: Hàotiān, en: the white sky }
line: "Snow, then a bowl below sea level, then dunes."
hero: taklamakan
month: 7
hour: 21.2

rail:
  - { lat: 43.8000, lon: 88.3500, above_ground_m: 2500, speed: 300 }   # Bogda Peak, 5,445 m, from well above its ridges: at 1,500 m its flank was a wall beside the title
  - { lat: 43.4000, lon: 88.8000, above_ground_m: 1200, speed: 300 }
  - { lat: 43.0000, lon: 89.1900, above_ground_m: 800, speed: 300 }   # Turpan
  - { lat: 42.6800, lon: 89.2600, above_ground_m: 500, speed: 300 }   # Ayding Lake, -154 m
  - { lat: 42.3000, lon: 88.8000, above_ground_m: 600, speed: 300 }
  - { lat: 41.7000, lon: 87.5000, above_ground_m: 700, speed: 300 }
  - { lat: 41.2000, lon: 86.2000, above_ground_m: 700, speed: 300 }   # Korla
  - { lat: 40.3000, lon: 85.0000, above_ground_m: 700, speed: 300 }
  - { lat: 39.5000, lon: 84.0000, above_ground_m: 700, speed: 300 }
  - { lat: 38.8000, lon: 83.3000, above_ground_m: 500, speed: 300 }   # the central dunes
  - { lat: 38.2000, lon: 82.2000, above_ground_m: 500, speed: 300 }
  - { lat: 37.6000, lon: 80.9000, above_ground_m: 600, speed: 300 }
  - { lat: 37.1000, lon: 79.9000, above_ground_m: 700, speed: 300 }   # Hotan

band: { above_ground_m: [300, 2500] }
corridor_deg: 60

look:
  sky: desert-evening
  palette: dune-orange
  cloud: none
  grade: warm

# The cast (D91): at 300 km a minute a figure standing in the world is
# passed in seconds, so the company rides with the camera: the Queen
# Mother from Bogda's Jade Pool over the first leg, with her blue birds;
# Wukong and Nezha over the Flaming Mountains (ch. 59-61); the party over
# the Flowing Sands (ch. 22), where Sha is taken on; the Bull Demon King
# as the white bull of the fight's end (ch. 61), the fire wheel on his
# horn, on the far left of the Flaming Mountains' seconds; and the Eight
# Immortals crossing the sea over Ayding Lake, the one ground below it.
# The Uyghur story's slain dragon lies along the red range itself, a
# monument twenty kilometres long, seen for the seconds the rail passes
# Turpan.
cast:
  - figure: xiwangmu
    role: companion
    offset: { ahead_m: 1600, right_m: 500, up_m: 20 }
    size_m: 320
    facing_deg: 200
    from: 6
    until: 40
    name_zh: 西王母
    line: "Xiwangmu, Queen Mother of the West, with her three blue birds."
    line_at: 20
  - figure: dragon
    variant: lantern
    role: monument
    at: { lat: 42.93, lon: 89.55, above_ground_m: 1500 }
    size_m: 20000
    facing_deg: 100
    from: 4
    until: 40
  - figure: wukong
    variant: still
    role: companion
    offset: { ahead_m: 1200, right_m: -720, up_m: -60 }
    size_m: 150
    facing_deg: 200
    from: 22
    until: 62
  - figure: nezha
    variant: still
    role: companion
    offset: { ahead_m: 1100, right_m: -420, up_m: 30 }
    size_m: 140
    facing_deg: 150
    from: 24
    until: 96
    name_zh: 哪吒
    line: "Nezha, who ends the battle of the Flaming Mountains."
    line_at: 30
  - figure: niumowang
    variant: still
    role: companion
    offset: { ahead_m: 1500, right_m: -760, up_m: -480 }
    size_m: 400
    facing_deg: 210
    from: 26
    until: 54
    name_zh: 牛魔王
    line: "The Bull Demon King, Nezha's fire wheel hung on his horn."
    line_at: 46
  - figure: baxian
    variant: still
    role: companion
    offset: { ahead_m: 1800, right_m: 620, up_m: -150 }
    size_m: 520
    facing_deg: 200
    from: 46
