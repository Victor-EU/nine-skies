# Scene 7 — Below the Sea.
#
# Off the Tian Shan at Bogda, down into the Turpan depression to Ayding Lake,
# then south-west across the Tarim basin over the Taklamakan's central dunes
# on their 90 m hero grid (F76), to Hotan.

id: below-the-sea
title: { zh: 吐鲁番, pinyin: Tǔlǔfān, en: Below the Sea }
# The sky's name in the Huainanzi's nine fields, the west (D91); on the card when the cast is on.
heaven: { zh: 颢天, pinyin: Hàotiān, en: the white sky }
line: "Snow, then a bowl below sea level, then dunes."
hero: taklamakan
month: 7
hour: 21.2

rail:
  - { lat: 43.8000, lon: 88.3500, above_ground_m: 2500, speed: 300 }   # Bogda Peak, 5,445 m, from well above its ridges: at 1,500 m its flank was a wall beside the title
  - { lat: 43.4000, lon: 88.8000, above_ground_m: 1200, speed: 300 }
  - { lat: 43.0000, lon: 89.1900, above_ground_m: 800, speed: 300 }   # Turpan
  - { lat: 42.6800, lon: 89.2600, above_ground_m: 500, speed: 300 }   # Ayding Lake, -154 m
  - { lat: 42.3000, lon: 88.8000, above_ground_m: 600, speed: 300 }
  - { lat: 41.7000, lon: 87.5000, above_ground_m: 700, speed: 300 }
  - { lat: 41.2000, lon: 86.2000, above_ground_m: 700, speed: 300 }   # Korla
  - { lat: 40.3000, lon: 85.0000, above_ground_m: 700, speed: 300 }
  - { lat: 39.5000, lon: 84.0000, above_ground_m: 700, speed: 300 }
  - { lat: 38.8000, lon: 83.3000, above_ground_m: 500, speed: 300 }   # the central dunes
  - { lat: 38.2000, lon: 82.2000, above_ground_m: 500, speed: 300 }
  - { lat: 37.6000, lon: 80.9000, above_ground_m: 600, speed: 300 }
  - { lat: 37.1000, lon: 79.9000, above_ground_m: 700, speed: 300 }   # Hotan

band: { above_ground_m: [300, 2500] }
corridor_deg: 60

look:
  sky: desert-evening
  palette: dune-orange
  cloud: desert-cirrus
  grade: warm

# The cast (D91): at 300 km a minute a figure standing in the world is
# passed in seconds, so the company rides with the camera: the Queen
# Mother from Bogda's Jade Pool over the first leg, with her blue birds;
# the Bull Demon King as the white bull of the fight's end over the
# Flaming Mountains (ch. 61), the fire wheel on his horn, Wukong after him
# and Nezha, sent to help, in his way (F130), the Bull named left of the
# middle so there is room behind him for Wukong and before him for Nezha;
# the party over the Flowing Sands (ch. 22), where Sha is taken on, Wukong
# ahead of it again (F128), named near the middle of the picture so there
# is room ahead of it for him (F129); and the Eight Immortals crossing the
# sea over Ayding Lake, the one ground below it.
# The Uyghur story's slain dragon lies along the red range itself, a
# monument twenty kilometres long, seen for the seconds the rail runs down
# on Turpan: painted, laid on the crest with his tail just clear of it,
# his line while he is ahead. It is dead, so nothing of it moves but the
# smoke off its back; the living dragons surface (D93).
cast:
  - figure: xiwangmu
    role: companion
    offset: { ahead_m: 1600, right_m: 500, up_m: 20 }
    poses: [default]
    paused: [peach]
    size_m: 420
    facing_deg: 200
    from: 6
    until: 40
    name_zh: 西王母
    line: "Xiwangmu, Queen Mother of the West, with her three blue birds."
    line_at: 20
  - figure: dragon
    variant: slain
    role: monument
    at: { lat: 42.93, lon: 89.55, above_ground_m: 350 }
    size_m: 20000
    facing_deg: 100
    from: 4
    until: 30
    motion: anchor
    name_zh: 火焰山
    line: "The dragon a Uyghur hero slew; its blood turned the mountains red."
    line_at: 14
  - figure: wukong
    variant: still
    role: companion
    offset: { ahead_m: 1200, right_m: -720, up_m: -60 }
    poses: [fan, default]
    size_m: 290
    facing_deg: 200
    from: 22
    until: 62
  - figure: nezha
    variant: still
    role: companion
    offset: { ahead_m: 1100, right_m: -420, up_m: 30 }
    poses: [default, charge]
    size_m: 310
    facing_deg: 150
    from: 24
    until: 96
    name_zh: 哪吒
    line: "Nezha, who ends the battle of the Flaming Mountains."
    line_at: 30
  - figure: niumowang
    variant: still
    role: companion
    offset: { ahead_m: 1500, right_m: -480, up_m: -480 }
    poses: [default]
    paused: [horns]
    size_m: 850
    facing_deg: 210
    from: 26
    until: 54
    name_zh: 牛魔王
    line: "The Bull Demon King, Nezha's fire wheel hung on his horn."
    line_at: 46
  - figure: baxian
    variant: still
    role: companion
    offset: { ahead_m: 1800, right_m: 620, up_m: -150 }
    poses: [arts, default]
    size_m: 1300
    facing_deg: 200
    from: 46
    until: 100
    name_zh: 八仙
    line: "The Eight Immortals crossing the sea, each by their own art."
    line_at: 52
  - figure: pilgrims
    variant: still
    role: companion
    offset: { ahead_m: 1000, right_m: 60, up_m: -300 }
    poses: [raft]
    size_m: 750
    facing_deg: 225
    from: 62
    until: 114
    name_zh: 流沙河
    line: "The Flowing Sands, where Sha Wujing joined them."
    line_at: 70
  # With the party, ahead of the horse, whenever it comes (F128).
  - figure: wukong
    variant: still
    role: companion
    offset: { ahead_m: 1000, right_m: 60, up_m: -300 }
    poses: [pilgrim, pilgrim-crouch]
    paused: [pilgrim-crouch]
    size_m: 270
    facing_deg: 225
    from: 62
    until: 114

captions:
  - { at: 8, text: "Bogda: {5445 m} of snow over a desert." }
  - { at: 40, text: "Ayding Lake, {154 m} below the sea. {47 °C} in July." }
  - { at: 102, text: "The Taklamakan: go in, and you will not come out." }

music: cue-07
