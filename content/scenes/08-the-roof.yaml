# Scene 8 — The Roof.
#
# Qinghai Lake south-west across the plateau by Madoi and the Hoh Xil to Nagqu
# and Namtso, ending over Lhasa: 1,500 km at 360 km/min, high and fast. The
# third step.

id: the-roof
title: { zh: 青藏高原, pinyin: Qīng-Zàng gāoyuán, en: The Roof }
# The sky's name in the Huainanzi's nine fields, the north-west (D91); on the card when the cast is on.
heaven: { zh: 幽天, pinyin: Yōutiān, en: the dim sky }
line: "Flat ground at {4500 m} for the whole scene."
# hero: none; the country grid alone
month: 9
hour: 18.9

rail:
  - { lat: 36.9000, lon: 100.2000, above_ground_m: 1200, speed: 360 }   # Qinghai Lake, 3,196 m
  - { lat: 36.3000, lon: 99.3000, above_ground_m: 1200, speed: 360 }
  - { lat: 35.5000, lon: 98.6000, above_ground_m: 1200, speed: 360 }
  - { lat: 34.9000, lon: 98.2000, above_ground_m: 1200, speed: 360 }   # Madoi, near the Yellow River's source
  - { lat: 34.6000, lon: 96.5000, above_ground_m: 1200, speed: 360 }
  - { lat: 34.4000, lon: 94.5000, above_ground_m: 1200, speed: 360 }   # Hoh Xil
  - { lat: 34.2000, lon: 92.4000, above_ground_m: 1200, speed: 360 }   # Tuotuohe
  - { lat: 33.2000, lon: 92.1000, above_ground_m: 1200, speed: 360 }
  - { lat: 32.2000, lon: 92.0000, above_ground_m: 1200, speed: 360 }
  - { lat: 31.5000, lon: 92.0000, above_ground_m: 1200, speed: 360 }   # Nagqu
  - { lat: 30.9000, lon: 91.2000, above_ground_m: 1000, speed: 360 }
  - { lat: 30.7000, lon: 90.6000, above_ground_m: 800, speed: 360 }   # Namtso, 4,718 m
  - { lat: 30.2000, lon: 90.8000, above_ground_m: 1000, speed: 360 }
  - { lat: 29.6500, lon: 91.1000, above_ground_m: 1000, speed: 360 }   # Lhasa

band: { above_ground_m: [500, 2500] }
corridor_deg: 60

look:
  sky: plateau-dusk
  palette: plateau-tan-turquoise
  cloud: plateau-cumulus
  grade: clear

# The cast (D91): the pilgrims crossing the Tongtian River (ch. 47-49)
# beside the camera, Wukong ahead of them (F128), named near the middle
# of the picture so there is room ahead of them for him either way they
# walk (F129), the upper Yangtze from Tuotuohe, a key on this rail;
# and black-necked cranes, the plateau's own, over the first leg from
# Qinghai Lake; from the Hoh Xil a qilin walking the air, as asked, and
# the old turtle of the Tongtian swimming it beside the party. Over the
# first leg, on the left, Nüwa rises with her stone of five colours to
# mend the sky: this is the north-west, where the Huainanzi says it
# broke, and the sky's name on the card is its own (D98). She took the
# place of the wind horse's prayer flags, which no Chinese viewer knew
# (F140). The qilin is the rarest of the good omens; it misses one
# viewing in four (D93).
cast:
  - figure: cranes
    variant: still
    role: companion
    offset: { ahead_m: 1300, right_m: -460, up_m: -220 }
    size_m: 600
    facing_deg: 60
    from: 6
    until: 56
    name_zh: 黑颈鹤
    line: "Black-necked cranes, the plateau's own."
    line_at: 20
  - figure: nuwa
    variant: still
    role: companion
    offset: { ahead_m: 1000, right_m: -250, up_m: 120 }
    size_m: 520
    facing_deg: 70
    from: 22
    until: 60
    name_zh: 女娲补天
    line: "Nüwa, who mended the broken sky with stones of five colours."
    line_at: 30
  - figure: pilgrims
    variant: still
    role: companion
    offset: { ahead_m: 760, right_m: 60, up_m: -40 }
    poses: [ice]
    size_m: 540
    facing_deg: 215
    from: 8
    until: 110
    name_zh: 通天河
    line: "The pilgrims, bound for the Tongtian, the river that reaches heaven."
    line_at: 68
  # With the party, ahead of the horse, whenever it comes (F128).
  - figure: wukong
    variant: still
    role: companion
    offset: { ahead_m: 760, right_m: 60, up_m: -40 }
    poses: [pilgrim, pilgrim-crouch]
    paused: [pilgrim-crouch]
    size_m: 195
    facing_deg: 215
    from: 8
    until: 110
  - figure: qilin
    variant: still
    role: companion
    offset: { ahead_m: 1100, right_m: -380, up_m: -180 }
    size_m: 560
    facing_deg: 225
    from: 58
    until: 112
    name_zh: 麒麟
    line: "A qilin, which walks on air and treads on nothing living."
    line_at: 76
    chance: 0.75
  - figure: turtle
    variant: still
    role: companion
    offset: { ahead_m: 1000, right_m: 560, up_m: -200 }
    size_m: 560
    facing_deg: 235
    from: 62
    until: 112
    name_zh: 老鼋
    line: "The old turtle who carried the pilgrims over the Tongtian."
    line_at: 84

captions:
  - { at: 12, text: "Qinghai Lake. From here the ground stays above {4000 m}." }
  - { at: 60, text: "Thin air, hard light, no trees. A plateau the size of Europe." }
  - { at: 100, text: "The Hoh Xil, {4700 m} up. No one lives here." }

music: cue-08
