# Scene 9 — The Wall.
#
# From Lhatse south over Tingri to the Rongbuk glacier and over Everest's
# summit on its 90 m hero grid (F76), then down the Nepal side for slack. The
# film ends here; the credits run over the map.
#
# The plateau leg is fast and the mountain slow (26 September 2026): at one
# speed the rail is 272 km, and at 60 km/min throughout a viewer at normal
# speed saw 114 km of it and the film ended over Tingri with Everest a grey
# line on the horizon. Now Lhatse to Tingri runs at 150 km/min, Rongbuk
# arrives at about 63 s, the summit at about 92 s, and the Nepal side at 50
# km/min keeps the rail over the 228 s a viewer at double speed needs.

id: the-wall
title: { zh: 珠穆朗玛, pinyin: Zhūmùlǎngmǎ, en: The Wall }
# The sky's name in the Huainanzi's nine fields, the north (D91); on the card when the cast is on.
heaven: { zh: 玄天, pinyin: Xuántiān, en: the dark sky }
line: "The plateau ends in a wall, and the wall is {8000 m}."
hero: everest
month: 10
hour: 19.25

rail:
  - { lat: 29.0800, lon: 87.6300, above_ground_m: 1500, speed: 150 }   # Lhatse
  - { lat: 28.9000, lon: 87.4000, above_ground_m: 1500, speed: 150 }
  - { lat: 28.6500, lon: 87.1200, above_ground_m: 1500, speed: 150 }   # Tingri
  - { lat: 28.4500, lon: 87.0000, above_ground_m: 1200, speed: 150 }
  - { lat: 28.3000, lon: 86.9000, above_ground_m: 1000, speed: 60 }
  - { lat: 28.1500, lon: 86.8500, above_ground_m: 1000, speed: 40 }   # Rongbuk
  - { lat: 28.0500, lon: 86.9000, above_ground_m: 1000, speed: 40 }   # the glacier
  - { lat: 27.9881, lon: 86.9250, above_ground_m: 1500, speed: 40 }   # Everest
  - { lat: 27.9000, lon: 86.8500, above_ground_m: 1500, speed: 50 }
  - { lat: 27.8000, lon: 86.7200, above_ground_m: 1200, speed: 50 }   # Namche, the other side
  - { lat: 27.6000, lon: 86.7000, above_ground_m: 1000, speed: 50 }
  - { lat: 27.3000, lon: 86.6000, above_ground_m: 1000, speed: 50 }
  - { lat: 27.0000, lon: 86.5000, above_ground_m: 800, speed: 60 }

band: { above_ground_m: [300, 3000] }
corridor_deg: 60
# Everest's slopes as the 90 m grid holds them, at half the film's drama:
# at six they are needles (F97).
exaggeration: 3

look:
  sky: last-light
  palette: snow-rock
  cloud: summit-plume
  grade: cold

# The cast (D91): the crossing (ch. 98). From Rongbuk the party goes over
# the wall ahead of the camera, high and small against the last light, on
# the way to the Western Heaven: the film crosses into Nepal, the novel
# into India. Silhouettes only, and nothing else over Chomolungma. The
# mountain's own goddess, Miyolangsangma on her tigress, is the
# alternative if wanted, or silence.
cast:
  - figure: pilgrims
    variant: still
    role: companion
    offset: { ahead_m: 2400, right_m: 380, up_m: 320 }
    size_m: 260
    facing_deg: 200
    from: 60
    until: 114

captions:
  - { at: 24, text: "Tingri, {4300 m}. The wall ahead is the Himalaya." }
  - { at: 60, text: "Rongbuk glacier. The summit is {3500 m} above it." }
  - { at: 95, text: "Everest. {8849 m}, and rising four millimetres a year." }

music: cue-09
